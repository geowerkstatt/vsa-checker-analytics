          function_hierarchic: { column: J, header: Funktionhierarchisch }
          detail: { column: K, header: Detail }
          error: { column: L, header: Fehlertyp }
          errorid: { column: M, header: Fehler-ID }
          class: { column: N, header: Klasse }
          topic: { column: O, header: Thema }
          check_type: { column: P, header: Prüftyp }
          tid: { column: Q, header: TID }
