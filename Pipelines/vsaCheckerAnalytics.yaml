processes:
  - id: zip_file_matcher
    implementation: Geopilot.Pipeline.Processes.Matcher.FileMatcher.FileMatcherProcess
    default_config:
      fileExtensions:
        - zip
  - id: unzipper
    implementation: Geopilot.Pipeline.Processes.Unzip.UnzipProcess
  - id: vsa_matcher
    implementation: VsaCheckerAnalytics.Processors.VsaMatcher.VsaMatcherProcess
  - id: geopackage_generation
    implementation: VsaCheckerAnalytics.Processors.GeopackageGeneration.GeopackageGenerationProcess
  - id: network_topology_patcher
    implementation: VsaCheckerAnalytics.Processors.NetworkTopologyPatcher.NetworkTopologyPatcherProcess
  - id: error_overview_export
    implementation: VsaCheckerAnalytics.Processors.ErrorOverviewExport.ErrorOverviewExportProcess
    default_config:
      errorDataSheet: "Error Data"
      errorDataAttributeMapping:
        recommendation_detail: Recommendation Detail
        recommendation: Recommendation
        gsp: GEP
        uc: WK
        module: Modul
        model: Modell
        category: Kategorie
        status: Status
        owner: Eigentümer
        function_hierarchic: Funktionhierarchisch
        detail: Detail
        error: Fehlertyp
        errorid: Fehler-ID
        class: Klasse
        topic: Thema
        check_type: Prüftyp
        tid: TID
        fid: FID
      errorDataColumnMapping:
        recommendation_detail: A
        recommendation: B
        gsp: C
        uc: D
        module: E
        model: F
        category: G
        status: H
        owner: I
        function_hierarchic: J
        detail: K
        error: L
        errorid: M
        class: N
        topic: O
        check_type: P
        tid: Q
        fid: R
      errorObjectSheet: "Error Object"
      errorObjectAttributeMapping:
        gsp_max: GEP Maximum
        uc_max: WK Maximum
        count_error: Anzahl Fehler
        class: Klasse
        tid: TID
        fid: FID
      errorObjectColumnMapping:
        gsp_max: A
        uc_max: B
        count_error: C
        class: D
        tid: E
        fid: F
      overviewWkSheet: "Uebersicht WK"
      overviewGepSheet: "Uebersicht GEP"
      overviewRowFields:
        - "class"
        - "error"
      overviewFilterFields:
        - "check_type"
        - "function_hierarchic"
        - "owner"
        - "status"
      overviewValueField: "fid"
      overviewValueName: "Anzahl Fehler"
      cantonErrorObjectSheet: "raw_data"
      cantonErrorColumnMapping:
        tabelle: A
        attribut: B
        anzahl_total: C
        anzahl_paa: D
        anzahl_saa: E
        anzahl_null: F
        anzahl_null_paa: G
        anzahl_null_saa: H
pipelines:
  - id: vsa_checker_analytics
    display_name:
      de: VSA Checker Analyse
      en: VSA Checker Analytics
      fr: VSA Analyse du vérificateur
      it: VSA Analisi del controllo
    steps:
      - id: gep_checker_file_matcher
        display_name:
          de: GEP-Checker-Datei Zuordnung (ZIP)
          en: GEP Checker File Matching (ZIP)
          fr: Correspondance des fichiers GEP Checker (ZIP)
          it: Corrispondenza file GEP Checker (ZIP)
        process_id: zip_file_matcher
        input:
          files: "${upload()}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
        conditions:
          post:
            fail_conditions:
              - expression: "Length([gep_checker_file_matcher.MatchedFiles]) != 1"
                message:
                  de: "Genau eine GEP-Checker-Datei ist erforderlich"
                  en: "Exactly one GEP Checker file is required"
                  fr: "Un fichier GEP Checker est requis"
                  it: "È necessario un file GEP Checker"
      - id: gep_checker_unzipper
        display_name:
          de: GEP-Checker-Datei entpacken
          en: GEP Checker File Unzipping
          fr: Décompression du fichier GEP Checker
          it: Estrazione del file GEP Checker
        process_id: unzipper
        input:
          zipFile: "${step_output(gep_checker_file_matcher.MatchedFiles)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: vsa_matcher
        display_name:
          de: VSA Zuordnung
          en: VSA Matching
          fr: VSA Correspondance
          it: VSA Corrispondenza
        process_id: vsa_matcher
        input:
          files: "${upload()}"
          unzippedFiles: "${step_output(gep_checker_unzipper.ExtractedFiles)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
        conditions:
          post:
            fail_conditions:
              - expression: "Length([vsa_matcher.Gep]) != 1"
                message:
                  de: "Ein GEP File notwendig"
                  en: "Exactly one GEP file is required"
                  fr: "Un fichier GEP est requis"
                  it: "È necessario un file GEP"
              - expression: "Length([vsa_matcher.UserOrgTable]) > 1"
                message:
                  de: "Mehrere benutzerdefinierte Organisationstabellen gefunden"
                  en: "Multiple user-defined organisation tables found"
                  fr: "Plusieurs tables d'organisation définies par l'utilisateur trouvées"
                  it: "Trovate più tabelle di organizzazione definite dall'utente"
              - expression: "Length([vsa_matcher.CheckerCsvA]) != 1"
                message:
                  de: "Ein Checker CSV ARA-Einzugsgebiet File notwendig"
                  en: "Exactly one checker CSV file for ARA catchment area is required"
                  fr: "Un fichier CSV du vérificateur pour le bassin versant ARA est requis"
                  it: "È necessario un file CSV del controllo per il bacino ARA"
              - expression: "Length([vsa_matcher.CheckerCsvFp]) != 1"
                message:
                  de: "Ein Checker CSV Fachprüfungen File notwendig"
                  en: "Exactly one checker CSV file for technical inspections is required"
                  fr: "Un fichier CSV du vérificateur pour les examens techniques est requis"
                  it: "È necessario un file CSV del controllo per le verifiche tecniche"
              - expression: "Length([vsa_matcher.CheckerCsvT]) != 1"
                message:
                  de: "Ein Checker CSV Trägerschaft File notwendig"
                  en: "Exactly one checker CSV file for sponsorship is required"
                  fr: "Un fichier CSV du vérificateur pour l'organisme responsable est requis"
                  it: "È necessario un file CSV del controllo per l'ente responsabile"
              - expression: "[vsa_matcher.GpkgTemplate] == null"
                message:
                  de: "Ein GPKG Template File notwendig"
                  en: "Exactly one GPKG template file is required"
                  fr: "Un fichier de modèle GPKG est requis"
                  it: "È necessario un file modello GPKG"
              - expression: "[vsa_matcher.StandardOrgTable] == null"
                message:
                  de: "Ein Standard-Organisations-Tabellen File notwendig"
                  en: "Exactly one standard organisation table file is required"
                  fr: "Un fichier de table d'organisation standard est requis"
                  it: "È necessario un file di tabella organizzativa standard"
      - id: geopackage_generation
        display_name:
          de: GeoPackage Erstellung
          en: GeoPackage Generation
          fr: GeoPackage Generation
          it: GeoPackage Generation
        process_id: geopackage_generation
        input:
          geoPackage: "${step_output(vsa_matcher.GpkgTemplate)}"
          dssMiniXtf: "${step_output(vsa_matcher.Gep)}"
          defaultOrgsXtf: "${step_output(vsa_matcher.StandardOrgTable)}"
          userOrgsXtf: "${step_output(vsa_matcher.UserOrgTable)}"
          checkerCsvT: "${step_output(vsa_matcher.CheckerCsvT)}"
          checkerCsvA: "${step_output(vsa_matcher.CheckerCsvA)}"
          checkerCsvFp: "${step_output(vsa_matcher.CheckerCsvFp)}"
          errorMatrix: "${file(ErrorMatrix_v3.xlsx)}"
          language: "${step_output(vsa_matcher.Language)}"
          modelVersion: "${step_output(vsa_matcher.ModelVersion)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
        conditions:
          post:
            fail_conditions:
              - expression: "[geopackage_generation.GeneratedGeopackage] == null"
                message:
                  de: "Der Import der Daten in das GeoPackage ist fehlgeschlagen"
                  en: "The import of the data into the GeoPackage has failed"
                  fr: "L'importation des données dans le GeoPackage a échoué"
                  it: "L'importazione dei dati nel GeoPackage non è andata a buon fine"
      - id: error_overview_export
        display_name:
          de: Fehlerübersicht Export
          en: Error Overview Export
          fr: Export de l'aperçu des erreurs
          it: Esportazione panoramica degli errori
        process_id: error_overview_export
        input:
          geopackage: "${step_output(geopackage_generation.GeneratedGeopackage)}"
          cantonErrorMatrixTemplate: "${file(ErrorMatrixKanton.xlsx)}"
        output_actions:
          - property: ErrorOverview
            actions:
              - Download
          - property: CantonErrorMatrix
            actions:
              - Download
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: network_topology_patcher
        display_name:
          de: Netzwerktopologie Patcher
          en: Network Topology Patcher
          fr: Correctif de topologie du réseau
          it: Patcher topologia di rete
        process_id: network_topology_patcher
        input:
          geoPackage: "${step_output(geopackage_generation.GeneratedGeopackage)}"
        output_actions:
          - property: PatchedGeopackage
            actions:
              - Download
          - property: StatusMessage
            actions:
              - StatusMessage
        conditions:
          post:
            fail_conditions:
              - expression: "[network_topology_patcher.PatchedGeopackage] == null"
                message:
                  de: "Die Rekonstruktion der Netzwerktopologie ist fehlgeschlagen"
                  en: "Network topology reconstruction failed"
                  fr: "La reconstruction de la topologie du réseau a échoué"
                  it: "La ricostruzione della topologia di rete non è riuscita"
