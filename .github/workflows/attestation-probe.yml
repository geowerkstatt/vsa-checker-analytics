name: Attestation probe

on:
  push:
    branches:
      - test/attestation-availability
  workflow_dispatch:

permissions: {}

jobs:
  probe-attestation:
    runs-on: ubuntu-latest
    name: Attest a throwaway file and verify it
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Create throwaway subject
        run: echo "attestation probe $GITHUB_RUN_ID" > probe.txt

      - name: Generate attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: probe.txt

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify probe.txt --repo "$GITHUB_REPOSITORY"
