name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Install dependencies
        run: dotnet restore VSACheckerAnalytics.slnx

      - name: Build dotnet
        run: dotnet build VSACheckerAnalytics.slnx -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test VSACheckerAnalytics.slnx -c Release --no-build --verbosity normal
