name: Release

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Build plugin and create a new GitHub release
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set environment variables
        run: |
          echo VERSION=$(grep -oP "(?<=<VersionPrefix>)[^<]+" Directory.Build.props).$GITHUB_RUN_NUMBER >> $GITHUB_ENV

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0"

      - name: Authenticate to GitHub Packages
        run: dotnet nuget update source github-geowerkstatt --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Publish plugin
        run: dotnet publish src/VSACheckerAnalytics/VSACheckerAnalytics.csproj -c Release -p:Version=${{ env.VERSION }} -o publish

      - name: Zip plugin output
        run: |
          cd publish
          zip -r ../VSACheckerAnalytics-v${{ env.VERSION }}.zip .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push plugin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/geowerkstatt/vsa-checker-analytics:${{ env.VERSION }}
            ghcr.io/geowerkstatt/vsa-checker-analytics:latest

      - name: Create GitHub release with asset
        run: |
          gh release create "v${{ env.VERSION }}" \
            --target ${{ github.sha }} \
            --title "${{ env.VERSION }}" \
            --generate-notes \
            "VSACheckerAnalytics-v${{ env.VERSION }}.zip"
