name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build plugin
    # Only main is reviewed, so a release from another branch could ship unreviewed code
    # (geowerkstatt/geopilot#921). The release job needs this job and is skipped with it.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    # The build runs code from NuGet packages, so it gets no write access and no OIDC token.
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set version
        id: version
        run: |
          version="$(grep -oP "(?<=<VersionPrefix>)[^<]+" Directory.Build.props).$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0"

      - name: Authenticate to GitHub Packages
        run: dotnet nuget update source github-geowerkstatt --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugin
        run: dotnet publish src/VSACheckerAnalytics/VSACheckerAnalytics.csproj -c Release -p:Version="$VERSION" -o publish

      - name: Zip plugin output
        run: |
          cd publish
          zip -r "../VSACheckerAnalytics-v$VERSION.zip" .

      # The ZIP keeps all platforms. The image only goes into Linux containers, so it holds the
      # linux-x64 build.
      - name: Publish plugin for the image
        run: |
          rm -rf publish
          dotnet publish src/VSACheckerAnalytics/VSACheckerAnalytics.csproj -c Release -r linux-x64 -p:Version="$VERSION" -o publish

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            publish/
            VSACheckerAnalytics-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          # Only hands the build over to the release job.
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    name: Push plugin image and create GitHub release
    needs: build
    timeout-minutes: 10
    # Runs no build code: it packs the build output into the image, pushes and attests it.
    permissions:
      contents: write
      # Pushes the image with its attestation.
      packages: write
      # The build attestation of the image.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      # Before the download, because the checkout cleans the workspace.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push plugin image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # One manifest instead of an index with BuildKit's own attestation: the attested digest is
          # the one deployments pin, and the package gets no untagged child versions.
          provenance: false
          tags: ghcr.io/geowerkstatt/vsa-checker-analytics:v${{ env.VERSION }}

      - name: Attest plugin image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/geowerkstatt/vsa-checker-analytics
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release with asset
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "VSACheckerAnalytics-v$VERSION.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
